<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">SRDSI — Apuntes de Seguridad, Rendimiento y Disponibilidad de Servicios e Infraestructuras</title>
  <desc id="desc">Banner de la documentación SRDSI: un escudo con un prompt de terminal y el título de la asignatura.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3ff"/>
      <stop offset="55%" stop-color="#f7f9ff"/>
      <stop offset="100%" stop-color="#eefaf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3949ab"/>
      <stop offset="55%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eeff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#3949ab" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a237e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="1180" cy="36" r="190" fill="#3949ab" opacity="0.045"/>
  <circle cx="74" cy="300" r="150" fill="#00897b" opacity="0.05"/>

  <g filter="url(#shadow)">
    <path d="M164 62 L246 93 V168 C246 214 211 244 164 262 C117 244 82 214 82 168 V93 Z"
          fill="url(#shield)" stroke="#3949ab" stroke-width="9" stroke-linejoin="round"/>
    <path d="M164 78 L231 103 V168 C231 205 203 230 164 246 C125 230 97 205 97 168 V103 Z"
          fill="none" stroke="#c5d0f5" stroke-width="2"/>
  </g>
  <text x="164" y="194" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="72" font-weight="700" fill="#283593">&gt;_</text>

  <text x="302" y="132"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="92" font-weight="800" letter-spacing="1" fill="#1a237e">SRDSI</text>

  <text x="304" y="184"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="29" font-weight="600" fill="#334155">Apuntes de Seguridad, Rendimiento y</text>
  <text x="304" y="221"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="29" font-weight="600" fill="#334155">Disponibilidad de Servicios e Infraestructuras</text>

  <text x="304" y="276"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="18" font-weight="600" letter-spacing="0.6" fill="#3949ab">UPV/EHU · TEORÍA · COMANDOS · LABORATORIOS RESUELTOS</text>

  <rect x="0" y="312" width="1280" height="8" fill="url(#accent)"/>
</svg>
