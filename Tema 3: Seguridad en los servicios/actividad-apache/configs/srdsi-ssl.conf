# /etc/apache2/sites-available/srdsi-ssl.conf
# Sitio HTTPS. El certificado de servidor y la clave están en /etc/apache2/ssl/.
# Requiere el módulo ssl (sudo a2enmod ssl) y el puerto 443 en ports.conf.
#
# cadena-cas.pem = subca_cert.pem + ca_cert.pem (la subCA primero).
#
# SSLVerifyClient optional: el sitio se ve sin certificado de cliente, pero la
# zona privada exige uno válido y con O=SRDSI y OU autorizada.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.srdsi.lab
    ServerAlias srdsi.lab
    ServerAdmin webadmin@srdsi.lab
    DocumentRoot /var/www/srdsi-ssl/docs

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    /etc/apache2/ssl/serv_cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/serv_key.pem
    # En Apache >= 2.4.8 también puede ir la cadena concatenada en SSLCertificateFile.
    SSLCertificateChainFile /etc/apache2/ssl/subca_cert.pem

    SSLVerifyClient optional
    SSLVerifyDepth 2
    SSLCACertificateFile /etc/apache2/ssl/cadena-cas.pem

    <Directory /var/www/srdsi-ssl/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Zona privada: solo con TLS y con un certificado de cliente que cumpla la
    # condición. SSLRequire está obsoleto en 2.4; se mantiene porque es la
    # directiva que usa el enunciado.
    <Directory /var/www/srdsi-ssl/docs/zona-privada>
        SSLRequireSSL
        Require ssl-verify-client
        SSLVerifyDepth 5
        SSLRequire ( %{SSL_CLIENT_S_DN_O} eq "SRDSI" and %{SSL_CLIENT_S_DN_OU} in {"LABS", "ALUM", "PROF"} )
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/srdsi-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/srdsi-ssl-access.log combined
</VirtualHost>
</IfModule>
