# /etc/apache2/sites-available/srdsi-ssl-mutual.conf
# Variante en la que TODO el sitio exige certificado de cliente (TLS mutuo).
# No convive con srdsi-ssl.conf: mismo ServerName y puerto.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.srdsi.lab
    ServerAlias srdsi.lab
    ServerAdmin webadmin@srdsi.lab
    DocumentRoot /var/www/srdsi-ssl/docs

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    /etc/apache2/ssl/serv_cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/serv_key.pem
    SSLCertificateChainFile /etc/apache2/ssl/subca_cert.pem

    SSLVerifyClient require
    SSLVerifyDepth 2
    SSLCACertificateFile /etc/apache2/ssl/cadena-cas.pem

    <Directory /var/www/srdsi-ssl/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/srdsi-ssl-mutual-error.log
    CustomLog ${APACHE_LOG_DIR}/srdsi-ssl-mutual-access.log combined
</VirtualHost>
</IfModule>
