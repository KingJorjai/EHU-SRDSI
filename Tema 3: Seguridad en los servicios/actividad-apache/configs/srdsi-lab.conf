# /etc/apache2/sites-available/srdsi-lab.conf
# Sitio virtual HTTP con una zona privada protegida por autenticación básica.
# Activar con: sudo a2ensite srdsi-lab && sudo apache2ctl graceful

<VirtualHost *:80>
    ServerName www.srdsi.lab
    ServerAlias srdsi.lab
    ServerAdmin webadmin@srdsi.lab
    DocumentRoot /var/www/srdsi-lab/docs

    <Directory /var/www/srdsi-lab/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Zona privada: usuario y contraseña en el fichero de htpasswd.
    # Requiere el módulo auth_basic (sudo a2enmod auth_basic).
    <Directory /var/www/srdsi-lab/docs/zona-privada>
        AuthType Basic
        AuthName "Zona acceso restringido a personal autorizado"
        AuthUserFile /etc/apache2/usersweb
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/srdsi-lab-error.log
    CustomLog ${APACHE_LOG_DIR}/srdsi-lab-access.log combined
</VirtualHost>
