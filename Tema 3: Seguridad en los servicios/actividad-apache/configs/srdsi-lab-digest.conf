# /etc/apache2/sites-available/srdsi-lab-digest.conf
# Variante del sitio HTTP en la que la zona privada usa autenticación Digest.
# Requiere el módulo auth_digest (sudo a2enmod auth_digest) y desactivar
# srdsi-lab si los dos ficheros declaran el mismo ServerName.
#
# Las contraseñas se crean con:
#   sudo htdigest -c /etc/apache2/digest_users "Area privada" admin1
#   sudo htdigest    /etc/apache2/digest_users "Area privada" admin2

<VirtualHost *:80>
    ServerName www.srdsi.lab
    ServerAlias srdsi.lab
    ServerAdmin webadmin@srdsi.lab
    DocumentRoot /var/www/srdsi-lab/docs

    <Directory /var/www/srdsi-lab/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/srdsi-lab/docs/zona-privada>
        AuthType Digest
        AuthName "Area privada"
        AuthDigestAlgorithm MD5
        AuthDigestDomain http://www.srdsi.lab/zona-privada/
        AuthDigestProvider file
        AuthUserFile /etc/apache2/digest_users
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/srdsi-lab-digest-error.log
    CustomLog ${APACHE_LOG_DIR}/srdsi-lab-digest-access.log combined
</VirtualHost>
