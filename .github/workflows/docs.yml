name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.offline.yml'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/docs.yml'
      - 'General/**'
      - 'Tema 1: Introducción a la seguridad informática/**'
      - 'Tema 2: Seguridad en la comunicación/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Copiar PDFs, imágenes y material de laboratorio
        run: bash scripts/prepare_docs_assets.sh
      - name: Construir sitio online
        run: mkdocs build --strict
      - name: Construir sitio offline
        run: mkdocs build -f mkdocs.offline.yml -d site-offline --strict
      - name: Empaquetar bundle offline
        run: |
          cd site-offline
          zip -qr ../EHU-SRDSI-docs-offline.zip .
          cd ..
          mkdir -p site/recursos
          cp EHU-SRDSI-docs-offline.zip site/recursos/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: EHU-SRDSI-docs-offline
          path: EHU-SRDSI-docs-offline.zip
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
