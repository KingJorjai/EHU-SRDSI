site_name: SRDSI — Documentación
site_description: Documentación de examen de Seguridad, Rendimiento y Disponibilidad de Servicios e Infraestructuras
site_url: https://kingjorjai.github.io/EHU-SRDSI/
repo_url: https://github.com/KingJorjai/EHU-SRDSI
repo_name: KingJorjai/EHU-SRDSI
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      lang: es
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

exclude_docs: |
  superpowers/

extra:
  generator: false

copyright: Documentación de laboratorio SRDSI · UPV/EHU

nav:
  - Inicio: index.md
  - Guía:
      - guia/index.md
      - Programa: guia/programa.md
      - Evaluación: guia/evaluacion.md
      - VM y entorno: guia/vm-entorno.md
      - Bibliografía: guia/bibliografia.md
  - Tema 1:
      - tema1/index.md
      - Teoría:
          - Conceptos y amenazas: tema1/teoria/conceptos.md
          - Criptografía: tema1/teoria/criptografia.md
          - Comunicación segura: tema1/teoria/comunicacion-segura.md
          - Gestión de claves y PKI: tema1/teoria/gestion-claves.md
      - Comandos:
          - OpenSSL y PKI: tema1/comandos/openssl.md
          - GnuPG: tema1/comandos/gpg.md
          - Hashes e integridad: tema1/comandos/hash.md
      - Actividades:
          - Modelo de amenazas: tema1/actividades/amenazas.md
          - GnuPG: tema1/actividades/gnupg.md
          - Criptografía y Ascon: tema1/actividades/criptografia.md
          - Estudio de una CA: tema1/actividades/estudio-ca.md
      - Lab PKI:
          - tema1/lab-pki/index.md
          - Guía rápida: tema1/lab-pki/guia.md
          - Scripts: tema1/lab-pki/scripts.md
          - Informe completo: tema1/lab-pki/informe.md
          - Diseño web: tema1/lab-pki/web.md
  - Tema 2:
      - tema2/index.md
      - Teoría:
          - SSH: tema2/teoria/ssh.md
          - PGP y S/MIME: tema2/teoria/pgp-smime.md
          - TLS, DTLS y QUIC: tema2/teoria/tls-dtls.md
          - IPsec: tema2/teoria/ipsec.md
      - Comandos:
          - SSH y túneles: tema2/comandos/ssh.md
          - OpenSSL TLS/DTLS: tema2/comandos/openssl-tls.md
          - Wireshark y capturas: tema2/comandos/wireshark.md
          - PGP con GnuPG: tema2/comandos/pgp.md
      - Lab SSL:
          - tema2/lab-ssl/index.md
          - Guía rápida: tema2/lab-ssl/guia.md
          - Código: tema2/lab-ssl/codigo.md
          - Capturas y alertas: tema2/lab-ssl/capturas.md
          - Informe completo: tema2/lab-ssl/informe.md
  - Chuletas: chuletas/comandos.md
  - Recursos: recursos/pdfs.md
