# /etc/apache2/sites-available/pki2-usuario-ocsp.conf
# EXTRA E: el servidor web valida el certificado del USUARIO contra OCSP.
# Sin SSLOCSPEnable, Apache solo comprueba la firma de la cadena: un certificado
# de usuario revocado sigue entrando si no se configura CRL/OCSP.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.bocata-jamon.srdsi.lab
    DocumentRoot /var/www/pki2/docs

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile      /etc/apache2/ssl/pki2/servidor.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/pki2/servidor.key
    SSLCertificateChainFile /etc/apache2/ssl/pki2/subCA.crt

    # El certificado del usuario se pide solo en la zona privada.
    SSLVerifyClient optional
    SSLVerifyDepth 2
    SSLCACertificateFile /etc/apache2/ssl/pki2/cadena-cas.pem

    # Validación del certificado de cliente por OCSP.
    SSLOCSPEnable on
    # Si el certificado del usuario no tuviera AIA, hay que indicar el respondedor:
    # SSLOCSPOverrideResponder on
    # SSLOCSPDefaultResponder http://ocsp.bocata-jamon.srdsi.lab:4747

    <Directory /var/www/pki2/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/pki2/docs/zona-privada>
        SSLRequireSSL
        Require ssl-verify-client
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pki2-usuario-error.log
    CustomLog ${APACHE_LOG_DIR}/pki2-usuario-access.log combined
</VirtualHost>
</IfModule>
