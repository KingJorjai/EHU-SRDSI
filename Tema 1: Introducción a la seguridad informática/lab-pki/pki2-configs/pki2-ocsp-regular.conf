# /etc/apache2/sites-available/pki2-ocsp-regular.conf
# Caso 1: OCSP regular. El navegador consulta por su cuenta al respondedor
# (la URL va en la extensión AIA del certificado del servidor web).
# No hace falta ninguna directiva SSL adicional en Apache.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.bocata-jamon.srdsi.lab
    DocumentRoot /var/www/pki2/docs

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile      /etc/apache2/ssl/pki2/servidor.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/pki2/servidor.key
    SSLCertificateChainFile /etc/apache2/ssl/pki2/subCA.crt

    <Directory /var/www/pki2/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pki2-regular-error.log
    CustomLog ${APACHE_LOG_DIR}/pki2-regular-access.log combined
</VirtualHost>
</IfModule>
