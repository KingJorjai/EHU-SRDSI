# /etc/apache2/sites-available/pki2-ocsp-must-staple.conf
# Caso 3: OCSP Must-Staple (RFC 7633). La configuración de Apache es la misma
# que en el caso 2: lo que cambia es el certificado, que incluye la extensión
# TLS Feature: status_request. Sin staple, el navegador debe rechazar la conexión.
#
# Emite el certificado con el [server_ext] modificado (ver server-ext-must-staple.txt).

SSLStaplingCache "shmcb:/var/run/apache2/ssl_stapling(32768)"

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.bocata-jamon.srdsi.lab
    DocumentRoot /var/www/pki2/docs

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile      /etc/apache2/ssl/pki2/servidor-must-staple.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/pki2/servidor-must-staple.key
    SSLCertificateChainFile /etc/apache2/ssl/pki2/subCA.crt

    SSLCACertificateFile /etc/apache2/ssl/pki2/cadena-cas.pem
    SSLUseStapling On

    # SSLStaplingForceURL http://ocsp.bocata-jamon.srdsi.lab:4747
    # SSLStaplingResponseMaxAge 90
    # SSLStaplingStandardCacheTimeout 90

    <Directory /var/www/pki2/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pki2-must-staple-error.log
    CustomLog ${APACHE_LOG_DIR}/pki2-must-staple-access.log combined
</VirtualHost>
</IfModule>
