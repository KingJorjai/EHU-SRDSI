# /etc/apache2/sites-available/pki2-ocsp-stapling.conf
# Caso 2: OCSP stapling. Es el servidor web quien consulta al respondedor y
# envía la respuesta firmada ("staple") en el handshake TLS.
# Requiere mod_ssl y mod_socache_shmcb (sudo a2enmod ssl socache_shmcb).

# La caché debe declararse fuera de <VirtualHost>. La ruta del enunciado
# ("shmcb:logs/ssl_stapling(12000)") es relativa a ServerRoot; si el
# directorio /etc/apache2/logs no existe, usa una ruta absoluta como esta:
SSLStaplingCache "shmcb:/var/run/apache2/ssl_stapling(32768)"

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.bocata-jamon.srdsi.lab
    DocumentRoot /var/www/pki2/docs

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile      /etc/apache2/ssl/pki2/servidor.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/pki2/servidor.key
    SSLCertificateChainFile /etc/apache2/ssl/pki2/subCA.crt

    # Apache necesita la cadena de CAs para localizar al emisor del certificado
    # y consultar su respondedor OCSP.
    SSLCACertificateFile /etc/apache2/ssl/pki2/cadena-cas.pem
    SSLUseStapling On

    # Opcionales: fuerzan la URL del respondedor y acortan la caché para que
    # los cambios (revocación) se vean antes durante la práctica.
    # SSLStaplingForceURL http://ocsp.bocata-jamon.srdsi.lab:4747
    # SSLStaplingResponseMaxAge 90
    # SSLStaplingStandardCacheTimeout 90

    <Directory /var/www/pki2/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pki2-stapling-error.log
    CustomLog ${APACHE_LOG_DIR}/pki2-stapling-access.log combined
</VirtualHost>
</IfModule>
