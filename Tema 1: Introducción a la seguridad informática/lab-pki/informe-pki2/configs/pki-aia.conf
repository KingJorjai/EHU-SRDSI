# /etc/apache2/sites-available/pki-aia.conf
# Publica los certificados de las CAs en las URL de AIA que llevan los
# certificados emitidos. Sin esto, el navegador puede quedarse esperando la
# cadena al validar el sitio.
#
#   cp certificado-subCA.crt /var/www/pki/subCA.crt
#   cp certificado-rootCA.crt /var/www/pki/rootCA.crt
#
# Añade en /etc/hosts:
#   127.0.0.1 subCA.bocata-jamon.srdsi.lab rootCA.bocata-jamon.srdsi.lab

<VirtualHost *:80>
    ServerName subCA.bocata-jamon.srdsi.lab
    DocumentRoot /var/www/pki

    <Directory /var/www/pki>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName rootCA.bocata-jamon.srdsi.lab
    DocumentRoot /var/www/pki

    <Directory /var/www/pki>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>
