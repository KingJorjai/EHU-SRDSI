[options]
    UseSyslog
    interface = enp0s8

[openHTTP]
    sequence = 7000,8000,9000
    seq_timeout = 10
    command = /usr/sbin/iptables -I PROTECTED 1 -s %IP% -p tcp --dport 8080 -j ACCEPT
    tcpflags = syn
    cmd_timeout = 10
    stop_command = /usr/sbin/iptables -D PROTECTED -s %IP% -p tcp --dport 8080 -j ACCEPT
